<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soria Nación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Permanent+Marker&family=Rubik+Scribble&display=swap" rel="stylesheet">
<style>
/* Plan: diseño naive. Papel gris de póster, tinta negra de rotulador, cera morada, rojo de sello y ocre de estrella.
   Marco editorial limpio (grotesca Archivo) que enmarca lo hecho a mano (Permanent Marker, Rubik Scribble y garabatos SVG).
   Layout: móvil en horizontal compartido a la TV; escenas a pantalla completa sobre un tablero con cámara. */
#sn{--u:4px; --w:8px; --h:4px;
  --paper:#E3E3DC; --paper2:#D3D3C9; --sheet:#F8F7F2; --ink:#161616; --ink2:#4A4A44;
  --pur:#B98AD6; --purl:#DCC6EC; --purd:#6E3A93; --red:#EF4B45; --ochre:#D9A93E; --note:#F4E48E;
  --frame:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mark:'Permanent Marker','Marker Felt','Comic Sans MS',cursive;
  --scrib:'Rubik Scribble','Permanent Marker','Marker Felt',cursive;
  --r1:18px 7px 16px 9px / 9px 17px 8px 18px;
  --r2:8px 18px 10px 16px / 16px 9px 18px 8px;
  --rc:50% 46% 54% 48% / 48% 54% 46% 52%;
  --bar:72px; color-scheme:light;}
#sn,#sn *{box-sizing:border-box}
#sn{position:fixed;inset:0;z-index:2147483000;overflow:hidden;overscroll-behavior:contain;background-color:var(--paper);background-image:var(--grain,none);color:var(--ink);font-family:var(--frame);font-size:18px;font-weight:400;line-height:1.25;letter-spacing:normal;text-align:left;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#sn #sn-app{position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);overflow:hidden}
#sn input{-webkit-user-select:text;user-select:text;margin:0}
#sn button{-webkit-appearance:none;appearance:none;margin:0;font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#sn button:focus-visible,#sn input:focus-visible{outline:4px dashed var(--ink);outline-offset:4px}
#sn h1,#sn h2,#sn h3{margin:0;font-weight:400;text-wrap:balance}
#sn p{text-wrap:pretty}
#sn svg{max-width:none}
#sn .paper{background-color:var(--paper);background-image:var(--grain,none)}
#sn .eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(11px,calc(3.1 * var(--u)),16px);line-height:1.2;color:var(--ink2)}
#sn .scr{position:relative;isolation:isolate}
#sn .scr::before{content:"";position:absolute;inset:-10% -6%;z-index:-1;background:var(--sc,var(--pur));opacity:var(--so,1);-webkit-mask:var(--m-scrib) center/100% 100% no-repeat;mask:var(--m-scrib) center/100% 100% no-repeat;pointer-events:none}
#sn .sq{position:relative;width:fit-content;max-width:100%;padding-bottom:.12em}
#sn .sq::after{content:"";position:absolute;left:0;right:0;bottom:-.12em;height:.24em;background:var(--uc,var(--red));-webkit-mask:var(--m-squig) left center/auto 100% repeat-x;mask:var(--m-squig) left center/auto 100% repeat-x;pointer-events:none}
#sn .wave,#sn .wb{position:relative}
#sn .wave::before,#sn .wave::after,#sn .wb::before,#sn .wb::after{content:"";position:absolute;left:0;right:0;height:12px;pointer-events:none;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-size:auto 100%;mask-size:auto 100%;-webkit-mask-position:left bottom;mask-position:left bottom}
#sn .wave::before{top:-11px;background:var(--wf,var(--paper2));-webkit-mask-image:var(--m-wavefill);mask-image:var(--m-wavefill)}
#sn .wave::after{top:-11px;background:var(--ink);-webkit-mask-image:var(--m-wave);mask-image:var(--m-wave)}
#sn .wb::before{bottom:-11px;transform:scaleY(-1);background:var(--wf,var(--sheet));-webkit-mask-image:var(--m-wavefill);mask-image:var(--m-wavefill)}
#sn .wb::after{bottom:-11px;transform:scaleY(-1);background:var(--ink);-webkit-mask-image:var(--m-wave);mask-image:var(--m-wave)}
#sn .pst .let{font-family:var(--mark);fill:var(--ink)}
#sn .pst .sig{font-family:var(--mark);font-size:12px;fill:var(--ink)}
#sn .btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:48px;padding:.4em 1em;background:var(--sheet);color:var(--ink);border:3px solid var(--ink);border-radius:var(--r1);box-shadow:3px 4px 0 var(--ink);font-family:var(--frame);font-weight:800;font-size:clamp(14px,calc(4 * var(--u)),22px);line-height:1.05;text-align:center;text-transform:uppercase;letter-spacing:.03em;transition:transform .08s,box-shadow .08s}
#sn .btn:nth-child(even){border-radius:var(--r2)}
#sn .btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
#sn .btn.gold{background:var(--purl)}
#sn .btn.gold::before{content:"";position:absolute;inset:3px 6px;z-index:-1;background:var(--pur);-webkit-mask:var(--m-scrib) center/100% 100% no-repeat;mask:var(--m-scrib) center/100% 100% no-repeat}
#sn .btn.fraud{background:var(--red)}
#sn .btn.ghost,#sn .btn.ink{background:transparent;box-shadow:none}
#sn .btn.big{min-height:56px;font-family:var(--mark);font-weight:400;text-transform:none;letter-spacing:.02em;font-size:clamp(19px,calc(6 * var(--u)),36px)}
#sn .btn.sm{min-height:44px;padding:.2em .75em;font-size:clamp(12px,calc(3.5 * var(--u)),18px)}
#sn .btn[disabled]{opacity:.45;pointer-events:none}
#sn .ico{width:1em;height:1em;flex:none}
#sn .hd{display:block;border-radius:var(--rc);background:var(--bg-c,#fff);border:2px solid var(--ink)}
#sn .sw{display:flex;align-items:center;gap:.5em;font-weight:700;font-size:1rem;cursor:pointer}
#sn .sw input{-webkit-appearance:none;appearance:none;flex:none;width:30px;height:30px;margin:0;border:3px solid var(--ink);border-radius:6px 10px 5px 9px;background:var(--sheet);cursor:pointer}
#sn .sw input:checked{background:var(--purl) var(--i-check) center/78% no-repeat}
#sn .title{height:100%;display:flex;flex-direction:column;gap:calc(1.6 * var(--u));padding:calc(2.4 * var(--u)) calc(3.4 * var(--w)) calc(2.6 * var(--u))}
#sn .meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:12px;font-size:clamp(12px,calc(3.6 * var(--u)),20px);font-weight:500;letter-spacing:-.01em}
#sn .meta span:nth-child(2){text-align:center}
#sn .meta span:last-child{text-align:right;font-weight:800}
#sn .tgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:calc(3.4 * var(--w))}
#sn .tl{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:calc(1.4 * var(--u))}
#sn .tl .top{display:flex;align-items:flex-start;gap:calc(2.2 * var(--w))}
#sn .rmark{flex:none;width:clamp(30px,calc(10 * var(--u)),64px);height:clamp(30px,calc(10 * var(--u)),64px);margin-top:calc(.6 * var(--u))}
#sn .logo{font-family:var(--scrib);font-size:min(calc(10 * var(--w)),calc(18 * var(--u)));line-height:.86;text-transform:uppercase;color:var(--ink)}
#sn .logo span{color:var(--purd)}
#sn .concept{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(2.4 * var(--w));max-width:70ch}
#sn .concept p{margin:0;font-size:clamp(12px,calc(3.7 * var(--u)),20px);line-height:1.2}
#sn .concept b{font-weight:900;text-transform:uppercase}
#sn .menu{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
#sn .hint{margin:0;font-size:clamp(12px,calc(3.3 * var(--u)),17px);color:var(--ink2)}
#sn .pcard{position:relative;height:100%;aspect-ratio:3/4;background:var(--sheet);border:3px solid var(--ink);border-radius:var(--r2);box-shadow:6px 7px 0 var(--ink);overflow:hidden;transform:rotate(1.6deg)}
#sn .pcard svg{display:block;width:100%;height:100%}
#sn .tr{min-height:0;display:flex;align-items:center;justify-content:center;padding:calc(.6 * var(--u)) calc(.6 * var(--w)) calc(1.4 * var(--u))}
#sn .tr .pcard{max-width:calc(40 * var(--w))}
#sn.is-short .hint{display:none}
#sn .setup{height:100%;display:flex;flex-direction:column}
#sn .setup header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:calc(2.4 * var(--u)) calc(3.4 * var(--w)) calc(1.4 * var(--u))}
#sn .setup header h2{font-weight:900;text-transform:uppercase;font-size:clamp(24px,calc(8.4 * var(--u)),56px);line-height:.88;letter-spacing:-.02em}
#sn .setup header p{margin:0;max-width:40ch;font-size:clamp(13px,calc(3.8 * var(--u)),20px);color:var(--ink2)}
#sn .setup .scroll{flex:1;min-height:0;overflow:auto;padding:10px calc(3.4 * var(--w)) 22px}
#sn .setup footer{display:flex;align-items:center;justify-content:flex-end;gap:12px 18px;flex-wrap:wrap;padding:10px calc(3.4 * var(--w)) 12px;background:var(--paper2)}
#sn .setup footer .sp{flex:1}
#sn .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 16px}
#sn .tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 12px;background:var(--sheet);border:3px solid var(--ink);border-radius:var(--r1);box-shadow:4px 5px 0 var(--ink);transform:rotate(var(--rt,0deg))}
#sn .tile:nth-child(3n+1){--rt:-.7deg}
#sn .tile:nth-child(3n+2){--rt:.6deg;border-radius:var(--r2)}
#sn .tile:nth-child(3n){--rt:-.2deg}
#sn .tile.off{opacity:.5;box-shadow:none}
#sn .tile .hd{width:58px;height:58px}
#sn .tile .nmw{grid-column:2;min-width:0}
#sn .tile .nm{font-family:var(--mark);font-size:1.65rem;line-height:1;color:var(--c)}
#sn .tile .rl{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;line-height:1.15;color:var(--ink2)}
#sn .tile input[type=text]{grid-column:1 / -1;width:100%;min-height:44px;padding:.25em .7em;font:inherit;font-size:1.1rem;font-weight:600;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:var(--r2)}
#sn .tile input[type=text]::placeholder{color:#6A6A63}
#sn .tile .sw{grid-column:3;grid-row:1}
#sn #sn-stage{position:absolute;inset:0;overflow:hidden;background-color:var(--paper);background-image:var(--grain,none)}
#sn #sn-cam{position:absolute;left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - var(--bar) - 8px);transform-origin:0 0;will-change:transform;transition:transform 1.1s cubic-bezier(.65,0,.25,1)}
#sn .board{position:relative;width:100%;height:100%;container-type:size;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:6px;padding:8px}
#sn .cell{--cw:calc(100cqw / var(--cols));font-size:calc(var(--cw) * .14);position:relative;isolation:isolate;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--sheet);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r1);text-align:center;transform:rotate(var(--rot,0deg))}
#sn .cell:nth-child(even){border-radius:var(--r2)}
#sn .cell::before{content:"";position:absolute;inset:-8%;z-index:-1;background:var(--sc,transparent);opacity:.36;-webkit-mask:var(--m-scrib) center/100% 100% no-repeat;mask:var(--m-scrib) center/100% 100% no-repeat}
#sn .cell.k-norm::before{display:none}
#sn .cell .st{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;padding:.2em .4em 0;line-height:1}
#sn .cell .num{font-family:var(--mark);font-size:1.55em}
#sn .cell .avs{display:flex;gap:2px}
#sn .cell .avs .hd{width:1.55em;height:1.55em;border-width:1.5px}
#sn .cell .lab{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 .3em;line-height:1.02;font-size:1.06em;font-weight:750;font-stretch:84%;overflow:hidden;text-shadow:0 0 3px var(--sheet),0 0 2px var(--sheet)}
#sn .cell .lab span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#sn .cell .toks{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;padding:1px 1px 2px}
#sn .tok{width:calc(var(--cw) * .28);height:calc(var(--cw) * .28);border-radius:var(--rc);border:2px solid var(--ink);background:var(--bg-c);box-shadow:0 0 0 1.5px var(--c);overflow:hidden}
#sn .toks.many .tok{width:calc(var(--cw) * .21);height:calc(var(--cw) * .21);border-width:1.5px}
#sn .toks.lots .tok{width:calc(var(--cw) * .165);height:calc(var(--cw) * .165);border-width:1.5px;box-shadow:none}
#sn .tok svg{width:100%;height:100%;display:block}
#sn .tok.me{position:relative;z-index:1;box-shadow:0 0 0 3px var(--red);animation:sn-bob 1s ease-in-out infinite}
@keyframes sn-bob{50%{transform:translateY(-12%) scale(1.15)}}
#sn .cell.k-start{--sc:#3E9B57}
#sn .cell.k-end{--sc:var(--ochre)}
#sn .cell.k-ref{--sc:var(--red)}
#sn .cell.k-jail{background-image:repeating-linear-gradient(90deg,transparent 0 .75em,rgba(22,22,22,.2) .75em .92em)}
#sn .cell.cur{border-width:3px}
#sn #sn-ring{position:absolute;z-index:3;pointer-events:none;overflow:visible;transition:left .45s ease,top .45s ease,width .45s ease,height .45s ease}
#sn #sn-ring path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#sn #sn-hud{position:absolute;inset:0;z-index:5;pointer-events:none}
#sn .bar{position:absolute;left:0;right:0;bottom:0;height:var(--bar);display:flex;flex-direction:column;justify-content:center;background:var(--paper2);pointer-events:auto;animation:sn-up .35s ease-out}
@keyframes sn-up{from{transform:translateY(100%)}}
#sn .bar .r1{flex:1;min-height:0;display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap;align-content:center}
#sn .bar .r1 > .hd{width:calc(min(var(--bar),96px) - 22px);height:calc(min(var(--bar),96px) - 22px);max-width:72px;max-height:72px;min-width:40px;min-height:40px;flex:none;border-width:3px}
#sn .bar .pi{min-width:0;flex:1 1 180px;line-height:1.05}
#sn .bar .pi b{display:block;font-family:var(--mark);font-weight:400;font-size:clamp(18px,calc(6 * var(--u)),34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sn .bar .pi span{display:block;font-weight:700;font-size:clamp(12px,calc(3.6 * var(--u)),19px);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sn .bar .cta{min-height:clamp(46px,calc(12 * var(--u)),64px);font-family:var(--mark);font-weight:400;text-transform:none;letter-spacing:.02em;font-size:clamp(19px,calc(5.8 * var(--u)),34px);padding:.2em .9em}
#sn .bar .nts{display:flex;gap:8px;padding:6px 12px 0;overflow:hidden}
#sn .nt{flex:none;max-width:calc(60 * var(--w));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:clamp(12px,calc(3.4 * var(--u)),17px);padding:.15em .6em;background:var(--note);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r2);transform:rotate(-1deg)}
#sn .nt:nth-child(even){transform:rotate(1deg)}
#sn .splash{position:absolute;left:50%;top:calc((100% - var(--bar)) / 2);max-width:94%;display:flex;align-items:center;gap:calc(2.4 * var(--w));padding:calc(2.2 * var(--u)) calc(3 * var(--w));background:var(--sheet);color:var(--ink);border:4px solid var(--ink);border-radius:var(--r1);box-shadow:6px 8px 0 var(--ink);pointer-events:none;animation:sn-splash 2.6s ease forwards;white-space:nowrap}
#sn .splash .hd{width:clamp(56px,calc(20 * var(--u)),140px);height:clamp(56px,calc(20 * var(--u)),140px);border-width:4px}
#sn .splash small{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(11px,calc(3.4 * var(--u)),20px);color:var(--ink2)}
#sn .splash b{display:block;font-family:var(--mark);font-weight:400;font-size:clamp(30px,calc(13 * var(--u)),96px);line-height:1;color:var(--c);padding:.04em .12em;margin:.08em 0}
@keyframes sn-splash{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-6deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.06) rotate(-2deg)}22%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}78%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9) rotate(-2deg)}}
#sn #sn-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
#sn .scene{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto;animation:sn-fade .35s ease-out;overflow:hidden;background-color:var(--paper);background-image:var(--grain,none);color:var(--ink)}
@keyframes sn-fade{from{opacity:0}}
@keyframes sn-slidein{from{opacity:0;transform:translateX(calc(5 * var(--w)))}}
@keyframes sn-popin{from{transform:scale(.6) rotate(-8deg);opacity:0}}
#sn .snav{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
#sn .dots{flex:1;display:flex;gap:8px}
#sn .dots i{width:13px;height:13px;border:2px solid var(--ink);border-radius:var(--rc)}
#sn .dots i.on{background:var(--ink)}
#sn .sc-intro{padding:calc(2.4 * var(--u)) calc(3.4 * var(--w)) calc(2.4 * var(--u));gap:calc(1.6 * var(--u))}

#sn .sc-intro .icol{min-width:0;display:flex;flex-direction:column;gap:calc(1.6 * var(--u))}
#sn .sc-intro .k{font-weight:900;text-transform:uppercase;font-size:clamp(28px,calc(11 * var(--u)),96px);line-height:.88;letter-spacing:-.02em;animation:sn-slidein .5s cubic-bezier(.2,.9,.3,1.1)}
#sn .sc-intro .tx{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:calc(1.6 * var(--u));animation:sn-slidein .6s .06s cubic-bezier(.2,.9,.3,1) both}
#sn .sc-intro p{margin:0;font-size:clamp(15px,calc(4.8 * var(--u)),34px);line-height:1.2;max-width:40ch}
#sn .sc-intro p b,#sn .hl{font-weight:800;background:linear-gradient(transparent 58%,var(--purl) 58%,var(--purl) 92%,transparent 92%)}
#sn .chips3{display:flex;gap:calc(1.6 * var(--w));flex-wrap:wrap;padding:calc(.4 * var(--u)) 0}
#sn .chips3 span{font-family:var(--mark);padding:.08em .6em;border:3px solid var(--ink);border-radius:var(--r1);background:var(--sheet);font-size:clamp(16px,calc(6 * var(--u)),42px);box-shadow:3px 4px 0 var(--ink);transform:rotate(-1deg)}
#sn .chips3 span:nth-child(2){transform:rotate(1.4deg);border-radius:var(--r2)}
#sn .chips3 span.so{--sc:var(--pur);transform:rotate(-3deg)}
#sn .sc-intro .snav .btn.big{margin-left:auto;min-height:50px;font-size:clamp(18px,calc(5.6 * var(--u)),34px)}
#sn .sc-intro .pcol{min-height:0;display:flex;align-items:center;padding:calc(.4 * var(--u)) calc(.6 * var(--w)) calc(1.2 * var(--u))}
#sn .sc-intro .pcol .pcard{max-width:calc(36 * var(--w));animation:sn-popin .5s cubic-bezier(.2,1.3,.4,1)}

#sn .sc-present .numb{position:absolute;left:calc(-1 * var(--w));top:calc(-.6 * var(--u));z-index:2;width:clamp(44px,calc(14 * var(--u)),88px);height:clamp(44px,calc(14 * var(--u)),88px);display:grid;place-items:center;background:var(--red);border:3px solid var(--ink);border-radius:var(--rc);font-family:var(--mark);font-size:clamp(22px,calc(8 * var(--u)),50px);transform:rotate(-8deg)}
#sn .sc-present .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(1.6 * var(--u));overflow:hidden}

function hash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
function rng(seed){ let s=seed>>>0; return function(){ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

function scribble(cx,cy,rx,ry,seed,step,rect){
  const r=rng(seed); const rows=Math.max(2,Math.round(2*ry/step)); let d='';
  for(let i=0;i<=rows;i++){
    const y=cy-ry+i*(2*ry/rows);
    const t=(y-cy)/ry;
    const half=rect ? rx*(0.9+r()*0.12) : rx*Math.sqrt(Math.max(0.05,1-t*t))*(0.8+r()*0.32);
    const L=cx-half+(r()-.5)*rx*.08, R=cx+half+(r()-.5)*rx*.08;
    const from=i%2?R:L, to=i%2?L:R;
    d+=(i?' L':'M')+f1(from)+' '+f1(y);
    d+=' Q'+f1((from+to)/2+(r()-.5)*rx*.25)+' '+f1(y+(r()-.5)*step)+' '+f1(to)+' '+f1(y+step*.9);
  }
  return d;
}
function loopPath(cx,cy,rx,ry,seed,turns){
  const r=rng(seed); const N=Math.round(36*turns); let d='';
  for(let i=0;i<=N;i++){ const a=-2.3+i/36*Math.PI*2; const k=1+(r()-.5)*.05+(i/N-.5)*.12; d+=(i?' L':'M')+f1(cx+Math.cos(a)*rx*k)+' '+f1(cy+Math.sin(a)*ry*k); }
  return d;
}

/* ====================================================== estado */
const SAVE='soria-nacion-v2';
let S = {screen:'title',scene:'overview',slide:0,players:[],cur:0,notes:[],log:[],modal:null,over:null,lock:false,
         card:null,result:null,pick:null,dice:null,moveMsg:'',turnKey:0,introReturn:false,
         setup:{sel:{patch:1,ivan:1,elisa:1,leo:1},names:{},order:true},hasSave:false};
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify({players:S.players,cur:S.cur,notes:S.notes,log:S.log.slice(0,12),over:S.over})); }catch(e){} }
function load(){ try{ const j=JSON.parse(localStorage.getItem(SAVE)||'null'); if(j&&j.players&&j.players.length>1&&!j.over){ S.hasSave=true; return j; } }catch(e){} S.hasSave=false; return null; }
function wipe(){ try{ localStorage.removeItem(SAVE); }catch(e){} S.hasSave=false; }
const cur = () => S.players[S.cur];
const pOfChar = c => S.players.find(p=>p.char===c);
const pById = id => S.players.find(p=>p.id===id);
const portrait = () => (ROOT.clientHeight||window.innerHeight) > (ROOT.clientWidth||window.innerWidth)*1.1;
const sqAcc = sq => (sq.k==='trap'||sq.k==='duel') ? byId[sq.who[0]].acc : ({start:'#2F7A45',end:'#8A6D00',ref:'#B3201F',jail:'#3a3a3a'}[sq.k]||'#D63A34');

/* ====================================================== motor de efectos */
function targets(who, self, picked){
  const all=S.players;
  if(!who||who==='self') return [self];
  if(who==='all') return all;
  if(who==='others') return all.filter(p=>p!==self);
  if(who==='picked') return picked?[picked]:[];
  if(who==='leader'){ const o=all.filter(p=>p!==self); if(!o.length) return []; const m=Math.max(...o.map(p=>p.pos)); return [o.find(p=>p.pos===m)]; }
  if(who.indexOf('char:')===0){ const p=pOfChar(who.slice(5)); return p?[p]:[]; }
  if(who.indexOf('exceptChar:')===0){ return all.filter(p=>p.char!==who.slice(11)); }
  if(who.indexOf('p:')===0){ const p=pById(who.slice(2)); return p?[p]:[]; }
  return [];
}
const nameList = tg => tg.length===S.players.length && tg.length>2 ? 'Todos' : tg.map(p=>p.name).join(', ');
function newCtx(){ return {lines:[],resolve:null,again:false,win:null,from:cur().pos}; }
function applyEffects(effs, picked){
  const self=cur(); const ctx=newCtx();
  effs.forEach(e=>{
    const tg=targets(e.who||'self',self,picked);
    if(!tg.length) return;
    const who=nameList(tg); const many=tg.length>1;
    if(e.mv){
      if(many) { tg.forEach(p=>{ p.pos=clampPos(p.pos+e.mv); }); ctx.lines.push(who+(e.mv>0?' avanzan ':' retroceden ')+plural(Math.abs(e.mv),'casilla','casillas')); }
      else tg.forEach(p=>{ const np=clampPos(p.pos+e.mv); const d=np-p.pos; p.pos=np; if(p.pos!==10) p.jail=false; ctx.lines.push(p.name+(d>=0?' avanza ':' retrocede ')+plural(Math.abs(d),'casilla','casillas')+(d===0?' (no puede moverse más)':'')); });
    }
    if(e.go){ tg.forEach(p=>{ p.pos=clampPos(e.go); ctx.resolve=p; ctx.lines.push(p.name+' salta a la casilla '+p.pos); }); }
    if(e.skip){ tg.forEach(p=>p.skip+=e.skip); ctx.lines.push(who+' pierde '+(e.skip===1?'el próximo turno':plural(e.skip,'turno','turnos'))); }
    if(e.jail){ tg.forEach(p=>{ p.pos=10; p.jail=true; }); ctx.lines.push(who+' va directo a la CÁRCEL'); }
    if(e.drink){ tg.forEach(p=>p.tragos+=e.drink); ctx.lines.push(who+(many?' beben ':' bebe ')+(e.lbl?e.lbl+' ('+plural(e.drink,'trago','tragos')+')':plural(e.drink,'trago','tragos'))); }
    if(e.fraud){ tg.forEach(p=>p.fraudes+=1); ctx.lines.push('Fraude electoral anotado a '+who); }
    if(e.again){ ctx.again=true; ctx.lines.push(self.name+' vuelve a tirar'); }
    if(e.win){ ctx.win=self; ctx.lines.push(self.name+' avanza a la casilla 50. Soria le apoya'); }
    if(e.swap){ const ahead=S.players.filter(p=>p!==self&&p.pos>self.pos).sort((a,b)=>a.pos-b.pos)[0];
      if(ahead){ const t=self.pos; self.pos=ahead.pos; ahead.pos=t; ctx.lines.push(self.name+' intercambia su ficha con '+ahead.name); } else ctx.lines.push('No hay nadie por delante: '+self.name+' se queda donde está'); }
    if(e.note){ const txt=e.note.replace('{self}',self.name).replace('{picked}',picked?picked.name:'?'); S.notes.push({txt:txt,owner:self.id,keep:/toda la partida/.test(txt)}); ctx.lines.push('Efecto activo: '+txt); }
  });
  return ctx;
}
function showResult(ctx, extra){
  extra=extra||{};
  ctx.lines.forEach(l=>S.log.unshift(l)); S.log=S.log.slice(0,12);
  S.result={lines:ctx.lines.length?ctx.lines:['Sin consecuencias. De momento.'],ctx:ctx,dice:extra.dice||null,pre:extra.pre||null,sq:extra.sq||null};
  S.scene='result'; S.lock=false; save(); render();
}
function runButton(b, picked){
  const effs=(b.e||[]).slice();
  if(b.pick && picked) b.pick.forEach(pe=>effs.push(Object.assign({},pe,{who:'picked'})));
  const ctx=applyEffects(effs,picked);
  showResult(ctx,{pre:b.t2||null,sq:S.card?S.card.sq:null});
}
function afterResult(){
  const ctx=S.result.ctx; const self=cur();
  if(ctx.win){ S.over=ctx.win.id; save(); render(); return; }
  if(ctx.resolve){ const p=ctx.resolve; panTo(p.name+' salta a la casilla '+p.pos, ()=>openSquare(p), 1700); return; }
  const then = ctx.again ? ()=>{ S.scene='zoom'; S.lock=false; save(); render(); } : nextTurn;
  if(self.pos!==ctx.from){ panTo(self.jail ? self.name+' entra en el calabozo' : self.name+' queda en la casilla '+self.pos, then, 1700); return; }
  then();
}
function panTo(msg, then, wait){
  S.scene='move'; S.moveMsg=msg; S.lock=true; render();
  setTimeout(then, wait||1500);
}

/* ====================================================== turnos */
function nextTurn(){
  let guard=0;
  do{
    S.cur=(S.cur+1)%S.players.length; const p=cur();
    if(p.skip>0){ p.skip--; S.log.unshift(p.name+' pierde su turno'); toast(p.name+' pierde su turno'); continue; }
    break;
  }while(++guard<30);
  const me=cur();
  S.notes=S.notes.filter(n=>n.keep||n.owner!==me.id);
  S.scene='overview'; S.lock=false; S.turnKey++; S.card=null; S.result=null; save(); render();
}
function startDice(n, title, then){
  S.lock=true; S.scene='dice'; S.dice={n:n,vals:Array.from({length:n},d6),done:false,title:title,res:''}; render();
  const delays=[70,70,75,80,85,95,105,115,130,150,170,195,225,260,300,350,410];
  let i=0;
  (function tick(){
    if(i<delays.length){
      S.dice.vals=S.dice.vals.map(v=>{ let x; do{ x=d6(); }while(x===v); return x; });
      ROOT.querySelectorAll('.bigdie').forEach((el,k)=>{ el.innerHTML=pips(S.dice.vals[k]); el.style.transform='rotate('+(Math.random()*60-30).toFixed(1)+'deg) scale('+(0.86+Math.random()*0.22).toFixed(2)+')'; });
      setTimeout(tick, delays[i++]); return;
    }
    const final=Array.from({length:n},d6); S.dice.vals=final; S.dice.done=true;
    S.dice.res = n===1 ? '¡Sale un '+final[0]+'!' : (final[0]===final[1] ? final[0]+' y '+final[1]+': ¡dobles!' : final[0]+' y '+final[1]+': no son dobles');
    render();
    setTimeout(()=>then(final), 1700);
  })();
}
function rollTurn(){
  if(S.lock||S.modal||S.over||S.scene!=='zoom') return;
  const p=cur();
  if(p.jail){ S.scene='jail'; render(); return; }
  startDice(1, 'Tira '+p.name, vals=>{
    S.log.unshift(p.name+' saca un '+vals[0]);
    moveTo(p, vals[0], ()=>openSquare(p));
  });
}
function moveTo(p,steps,done){
  const room=49-p.pos; const real=Math.min(steps,room);
  S.scene='move'; S.lock=true;
  S.moveMsg = real===0 ? p.name+' no puede pasar del Referéndum' : p.name+' avanza '+plural(real,'casilla','casillas')+(real<steps?' (tope: Referéndum)':'');
  render();
  let left=real;
  setTimeout(function tick(){
    if(left<=0){ setTimeout(done, 1000); return; }
    p.pos++; left--; updateBoard(); camApply(true); setTimeout(tick, 600);
  }, 750);
}

/* ====================================================== cartas */
function openSquare(p){
  const sq=SQ[p.pos-1];
  const view=viewFor(sq,p);
  S.card={sq:sq.n,view:view,btns:view.btns}; S.scene='card'; S.lock=false;
  save(); render();
}
function viewFor(sq,p){
  const me=p.char; const kindLabel={start:'Salida',trap:'Casilla trampa',duel:'Duelo',jail:'Cárcel',end:'Meta',ref:'Referéndum'}[sq.k]||'Casilla';
  let text=sq.x||'', banner=null, other=false, btns=sq.b||[];
  if(sq.k==='trap'||sq.k==='duel'){
    const names=sq.who.map(c=>byId[c].name);
    const present=sq.who.filter(c=>pOfChar(c));
    const mine=sq.who.indexOf(me)>=0;
    if(mine || !present.length){
      if(sq.k==='duel'){
        banner = mine ? 'DUELO: '+names.join(' y ') : 'DUELO CON SUPLANTACIÓN';
        btns=[ok('Aguantaron los dos')]; const notes=[];
        sq.who.forEach(c=>{
          const pl=pOfChar(c); const nm=byId[c].name;
          if(pl){ btns.push({l:sq.verb+': '+pl.name,c:'fraud',e:[{fraud:1,who:'p:'+pl.id}].concat(sq.bad.map(x=>Object.assign({},x,{who:'p:'+pl.id})))}); }
          else if(!mine && c===sq.who[0]){ notes.push('A '+nm+' lo haces tú'); btns.push({l:sq.verb+': '+p.name,c:'fraud',e:[{fraud:1}].concat(sq.bad)}); }
          else { notes.push('A '+nm+' lo hace quien tengas a tu derecha'); btns.push({l:sq.verb+': quien hizo de '+nm,c:'fraud',pick:[{fraud:1}].concat(sq.bad),pickT:'¿Quién hizo de '+nm+'?',e:[]}); }
        });
        text=(notes.length?'Falta algún candidato esta noche. '+notes.join('. ')+'. ':'')+sq.mine;
      } else {
        const owner=byId[sq.who[0]].name;
        banner = mine ? 'ES TU TRAMPA: '+byId[me].name.toUpperCase() : 'SUPLANTACIÓN: HAZ DE '+owner.toUpperCase();
        text = mine ? sq.mine : owner+' no se presenta esta noche, así que te toca suplantarle. '+sq.mine;
        btns=[ok('Aguantó el personaje',mine?(sq.mineOk||[]):[]),{l:'Fraude electoral',c:'fraud',e:[{fraud:1}].concat(sq.pen)}];
      }
    } else {
      other=true; banner='Trampa de '+names.join(' y ')+'. Tú no estás implicado';
      text=sq.other; btns=sq.otherB;
    }
  }
  if(sq.roll){ btns=[{l:'Tirar el dado',roll:true,c:'gold'}]; }
  return {kindLabel:kindLabel,banner:banner,other:other,text:text,btns:btns};
}
function pressBtn(i){
  if(S.lock||!S.card) return; const b=S.card.btns[i]; if(!b) return;
  if(b.roll){
    const sq=SQ[S.card.sq-1]; const p=cur();

function jailRoll(){

function applyFraud(pid,n,lbl){
  const p=pById(pid); if(!p) return; p.fraudes++; p.tragos+=n;
  S.log.unshift('FRAUDE ELECTORAL: '+p.name+' bebe '+lbl); S.log=S.log.slice(0,12);
  toast('Fraude electoral: '+p.name+' bebe '+lbl);
  S.modal=null; save(); render();
}
function adjust(pid,field,d){
  const p=pById(pid); if(!p) return;
  if(field==='pos'){ p.pos=Math.max(1,Math.min(49,p.pos+d)); if(p.pos!==10) p.jail=false; }
  if(field==='tragos') p.tragos=Math.max(0,p.tragos+d);
  save(); render();
}

function setBar(){
  const H=ROOT.clientHeight||window.innerHeight; let b=portrait()?180:Math.round(Math.max(60,Math.min(100,H*0.2)));
  if(S.notes.length && CAM_SCENES[S.scene]) b+=Math.round(Math.max(28,H*0.075));
  barPx=b; const a=$('#app'); if(a) a.style.setProperty('--bar',b+'px');

function camTarget(){
  const cam=$('#sn-cam'); const fit={z:1,x:0,y:0};
  if(!cam||S.scene==='overview'||S.scene==='intro'||S.scene==='present'||!cur()) return fit;
  const W=cam.clientWidth, H=cam.clientHeight;
  const cell=ROOT.querySelector('.cell[data-n="'+cur().pos+'"]'); if(!cell) return fit;
  const z=builtCols===10?2.5:1.9; const bl=cell.offsetParent?cell.offsetParent.clientLeft:0;
  const cx=bl+cell.offsetLeft+cell.offsetWidth/2, cy=bl+cell.offsetTop+cell.offsetHeight/2;
  let x=W/2-cx*z, y=H/2-cy*z;
  x=Math.min(0,Math.max(W-W*z,x)); y=Math.min(0,Math.max(H-H*z,y));
  return {z:z,x:x,y:y};
}
function camApply(smooth, force){
  const cam=$('#sn-cam'); if(!cam) return;
  if(!force && !CAM_SCENES[S.scene]) return;
  const t=camTarget(); const tr='translate('+t.x.toFixed(1)+'px,'+t.y.toFixed(1)+'px) scale('+t.z.toFixed(4)+')';
  if(tr===lastCam) return;
  cam.style.transitionDuration = smooth ? (S.scene==='move' ? '.5s' : '1.2s') : '0s';
  cam.style.transform=tr; lastCam=tr;
}

  }
  if(sc==='result'){
    const r=S.result; const p=cur(); const c=byId[p.char]; const sq=r.sq?SQ[r.sq-1]:null;
    return shell({acc:c.acc,no:r.sq||'!',kd:'Resultado · turno de '+esc(p.name),title:esc(sq?sq.t:'Resultado'),art:p.char,cap:esc(p.name),
      body:(r.dice?'<div class="drow">'+r.dice.map(dieSm).join('')+'</div>':'')+(r.pre?'<p>'+esc(r.pre)+'</p>':'')+'<div class="lines">'+r.lines.map(l=>'<div>'+esc(l)+'</div>').join('')+'</div>',
      acts:'<button class="btn gold big" data-primary data-act="after">Continuar'+IC_NEXT+'</button>'});
  }
  if(sc==='pick'){
    const self=cur(); const opts=S.players.filter(p=>!(S.pick.b.px&&p===self));
    return shell({acc:'#6E3A93',no:S.card?S.card.sq:'?',kd:'Elige jugador',title:esc(S.pick.title),
      raw:'<div class="picks">'+opts.map(p=>'<button class="pick" data-act="picked" data-id="'+p.id+'">'+head(p.char)+'<div><b>'+esc(p.name)+'</b><span>'+esc(byId[p.char].name)+'</span></div></button>').join('')+'</div>',
      acts:'<button class="btn" data-act="pickback">Volver a la carta</button>'});
  }
  if(sc==='jail'){
    const p=cur();
    return shell({acc:'#3a3a3a',no:10,kd:'Cárcel · turno de '+esc(p.name),title:'El Calabozo Vallisoletano',art:p.char,cap:esc(p.name)+' sigue entre rejas',
      body:'<p>Para salir tienes dos opciones:</p><p><span class="hl">Tirar dos dados.</span> Si sacas dobles, sales y avanzas lo que sumen.</p><p><span class="hl">Beberte el vaso de penalti de un trago.</span> Sales, pero pierdes el resto del turno.</p>',
      acts:'<button class="btn gold" data-primary data-act="jailroll">Tirar dos dados</button><button class="btn fraud" data-act="jaildrink">Beber el penalti y salir</button><button class="btn ink" data-act="tozoom">Volver</button>'});
  }
  return '';
}
function shell(o){
  return '<div class="scene sc-card" style="--c:'+o.acc+'"><div class="hdr wb"><span class="no">'+o.no+'</span><div class="ht"><div class="eyebrow">'+o.kd+'</div><h2 class="sq">'+o.title+'</h2></div></div>'+
   (o.raw ? '<div class="main noart">'+o.raw+'</div>' :
   '<div class="main'+(o.art?'':' noart')+'">'+(o.art?'<div class="art">'+artL(o.art)+'<div class="cap">'+o.cap+'</div></div>':'')+'<div class="txt">'+o.body+'</div></div>')+
   '<div class="acts wave">'+o.acts+'</div></div>';
}
function modalH(){
  const m=S.modal; if(!m) return '';
  if(m.t==='fraud'){
    const sel=m.sel; const dis=sel?'':'disabled';
    return '<div class="ov"><div class="card" role="dialog" aria-label="Fraude electoral" style="--c:#EF4B45"><div class="hdr"><h2>Fraude electoral</h2></div>'+
     '<div class="sheet"><p>Alguien ha titubeado, se ha reído o ha hablado como su Yo Real. ¿Quién ha sido?</p></div>'+
     '<div class="picks">'+S.players.map(p=>'<button class="pick'+(sel===p.id?' sel':'')+'" aria-pressed="'+(sel===p.id)+'" data-act="fsel" data-id="'+p.id+'">'+head(p.char)+'<div><b>'+esc(p.name)+'</b><span>'+esc(byId[p.char].name)+'</span></div></button>').join('')+'</div>'+
     '<div class="acts wave"><button class="btn fraud" data-act="fpen" data-n="2" data-l="2 tragos" '+dis+'>2 tragos</button><button class="btn fraud" data-act="fpen" data-n="3" data-l="un hidalgo" '+dis+'>Hidalgo</button><button class="btn fraud" data-act="fpen" data-n="4" data-l="un vaso de penalti" '+dis+'>Vaso de penalti</button><button class="btn" data-act="closem">Cancelar</button></div></div></div>';
  }
  if(m.t==='info'){
    const sq=SQ[m.n-1]; let body;
    if(sq.k==='trap'||sq.k==='duel') body='<p><b>Si cae '+sq.who.map(w=>esc(byId[w].name)).join(' o ')+':</b> '+esc(sq.mine)+'</p><p><b>Cualquier otro:</b> '+esc(sq.other)+'</p>';
    else body='<p>'+esc(sq.x)+'</p>';
    return '<div class="ov"><div class="card" role="dialog" aria-label="Casilla '+sq.n+'" style="--c:'+sqAcc(sq)+'"><div class="hdr"><span class="no">'+sq.n+'</span><h2>'+esc(sq.t)+'</h2></div><div class="sheet">'+body+'</div><div class="acts wave"><button class="btn" data-act="closem">Cerrar</button></div></div></div>';
  }
  if(m.t==='score'){
    const rows=S.players.map((q,i)=>{ const qc=byId[q.char];
      return '<div class="pl'+(i===S.cur?' act':'')+'">'+head(q.char)+'<div class="t"><b>'+esc(q.name)+(q.jail?'<span class="pill j">cárcel</span>':'')+(q.skip?'<span class="pill j">sin turno</span>':'')+'</b><span>'+esc(qc.name)+', '+esc(qc.role.toLowerCase())+'</span></div>'+
       '<div class="stat"><div><b>'+q.pos+'</b><small>casilla</small></div><div><b>'+q.tragos+'</b><small>tragos</small></div><div><b>'+q.fraudes+'</b><small>fraudes</small></div></div></div>'; }).join('');
    return '<div class="ov"><div class="card" role="dialog" aria-label="Marcador" style="--c:#6E3A93"><div class="hdr"><h2>Marcador de la vergüenza</h2></div><div class="sheet"><div class="score">'+rows+'</div></div><div class="acts wave"><button class="btn gold" data-act="closem">Cerrar</button></div></div></div>';
  }
  if(m.t==='rules') return sheetH('Reglas',rulesH());
  if(m.t==='settings'){
    const rows=S.players.map(p=>{ const f=(field,v,lbl)=>'<span class="ctl"><button class="btn" data-act="adj" data-id="'+p.id+'" data-f="'+field+'" data-d="-1" aria-label="Quitar '+lbl+' a '+esc(p.name)+'">−</button><output>'+v+'</output><button class="btn" data-act="adj" data-id="'+p.id+'" data-f="'+field+'" data-d="1" aria-label="Añadir '+lbl+' a '+esc(p.name)+'">+</button></span>';
      return '<div class="nm">'+esc(p.name)+'</div><div>Casilla '+f('pos',p.pos,'casilla')+'</div><div>Tragos '+f('tragos',p.tragos,'tragos')+'</div>'; }).join('');
    return '<div class="ov"><div class="card" role="dialog" aria-label="Menú" style="--c:#6E3A93"><div class="hdr"><h2>Menú</h2></div><div class="sheet"><h3>Corregir marcador</h3><div class="adj">'+rows+'</div>'+
      '<div class="cfg"><button class="btn sm" data-act="replay">Repetir la introducción</button><button class="btn sm" data-act="rules">Reglas</button><button class="btn sm" data-act="fs">Pantalla completa</button><button class="btn sm" data-act="newgame">Terminar y empezar otra</button></div></div><div class="acts wave"><button class="btn gold" data-primary data-act="closem">Volver al juego</button></div></div></div>';
  }
  return '';
}
function sheetH(title,body){
  return '<div class="ov"><div class="card" role="dialog" aria-label="'+title+'" style="--c:#6E3A93"><div class="hdr"><h2>'+title+'</h2></div><div class="sheet">'+body+'</div><div class="acts wave"><button class="btn gold" data-act="closem">Cerrar</button></div></div></div>';
}
function rulesH(){
  return '<h3>La regla de oro</h3><p>Durante todo el juego, y sobre todo en las casillas trampa, estás obligado a actuar como tu personaje político, traicionando a tu Yo Real. Si titubeas, te da la risa floja, abandonas tus ideales en un debate o alguien consigue sacarte de tus casillas, cometes <span class="hl">fraude electoral</span>.</p>'+
  '<p>El fraude se castiga con humillación pública y el castigo máximo: un vaso de penalti, un hidalgo o los tragos que dicte la casilla. Se puede denunciar en cualquier momento con el botón rojo.</p>'+
  '<h3>Cómo va cada turno</h3><ul><li>Sale el tablero entero con el jugador al que le toca. Pulsa Siguiente.</li>'+
  '<li>La cámara se acerca a su ficha. Pulsa Tirar el dado.</li>'+
  '<li>El dado ocupa toda la pantalla, la ficha avanza casilla a casilla y se abre la carta de esa casilla.</li>'+
  '<li>En las casillas trampa, si es la tuya actúas como tu personaje. Si es de otro, se aplica «cualquier otro».</li>'+
  '<li>Los botones de la carta mueven las fichas y anotan los tragos solos. Al terminar, pasa el turno.</li></ul>'+
  '<h3>Casillas especiales</h3><ul><li>Si caes en la trampa de un candidato que no juega esta noche, te toca suplantarlo.</li><li>No se puede pasar de la 49: todos pasan por el Referéndum. Con mayoría de Sí, ganas.</li><li>De la cárcel solo se sale sacando dobles o bebiendo el vaso de penalti de un trago.</li></ul>'+
  '<h3>Mando y teclado</h3><p>El botón principal de cada paso ya viene seleccionado: pulsa OK en el mando o Intro en el teclado. Las flechas mueven la selección, Escape cierra ventanas y F pone pantalla completa.</p><h3>En el marcador</h3><p>Un hidalgo cuenta como 3 tragos y un vaso de penalti como 4. Bebed con cabeza y sin presión.</p>';
}
function winH(){
  const p=pById(S.over); const c=byId[p.char]; let conf='';
  const cols=['#EF4B45','#B98AD6','#D9A93E','#3E9B57','#161616'];
  for(let i=0;i<34;i++){ const k=i%4, col=cols[i%5];
    const shape = k===0 ? star(12,12,10,col,1.6) : k===1 ? '<path d="M2 15 Q7 2 12 12 T22 9" fill="none" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round"/>' : k===2 ? '<path d="'+loopPath(12,12,7,7,i,1.1)+'" fill="none" stroke="'+col+'" stroke-width="3"/>' : '<path d="M5 6 L19 18 M18 5 L6 19" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round"/>';
    conf+='<svg class="conf" viewBox="0 0 24 24" aria-hidden="true" style="left:'+((i*29)%100)+'%;animation-duration:'+(4+(i%6)*0.7).toFixed(1)+'s;animation-delay:-'+((i*0.53)%7).toFixed(2)+'s">'+shape+'</svg>'; }
  return '<div class="win" role="alertdialog" aria-label="Victoria de '+esc(p.name)+'">'+(RM?'':conf)+'<div class="in"><div class="eyebrow">Escrutinio al 100 % · República Soriana</div><h1>¡Gloria al<br><span>Presidente!</span></h1>'+
  '<p>'+esc(p.name)+', como '+esc(c.name)+', es el nuevo dictador supremo de Soria. Valladolid capitula.</p><p>Todos los demás: terminaos los vasos de penalti y <span class="hl">reverencia formal</span>.</p>'+
  '<div class="row"><button class="btn gold big" data-primary data-act="rematch">Revancha'+IC_NEXT+'</button><button class="btn ink" data-act="title">Portada</button></div></div>'+
  '<div class="pw"><div class="pcard">'+poster(p.char,{boil:true,crown:true,lines:['¡VIVA','SORIA LIBRE!'],k:'win',alt:esc(c.name)+' coronado'})+'</div></div></div>';
}

/* ====================================================== render */
function render(){
  const root=APP; const fa=document.activeElement; const fid=fa&&ROOT.contains(fa)&&fa.id?fa.id:null;
  if(S.screen!=='game'){
    built=false; lastHud=lastLayer=lastTop=null; lastCam='';
    root.style.removeProperty('--bar');
    root.innerHTML=(S.screen==='title'?titleH():setupH())+(S.modal?'<div id="sn-top">'+modalH()+'</div>':'');
    afterRender(fid); return;
  }
  const cols=colsNow();
  if(!built||builtCols!==cols){
    root.innerHTML='<div id="sn-stage"><div id="sn-cam">'+boardH(cols)+'</div></div><div id="sn-hud"></div><div id="sn-layer"></div><div id="sn-top"></div>';
    built=true; builtCols=cols; lastHud=lastLayer=lastTop=null; lastCam='';
    setBar(); updateBoard(); camApply(false,true);
  }
  setBar(); updateBoard();
  const hh=hudH(); if(hh!==lastHud){ $('#sn-hud').innerHTML=hh; lastHud=hh; }
  const lh=layerH(); if(lh!==lastLayer){ $('#sn-layer').innerHTML=lh; lastLayer=lh; }
  const th=modalH()+(S.over?winH():''); if(th!==lastTop){ $('#sn-top').innerHTML=th; lastTop=th; }
  camApply(true); afterRender(fid);
}

/* ====================================================== foco, mando de la tele y teclado */
let lastFocusKey='';
function activeScope(){
  if(S.over||S.modal) return $('#sn-top')||APP;
  if(S.screen==='game') return $('#sn-layer .scene')||$('#sn-hud');
  return APP;
}
function afterRender(fid){
  const key=[S.screen,S.scene,S.slide,S.modal&&S.modal.t,!!S.over,S.turnKey,S.dice&&S.dice.done,S.card&&S.card.sq,S.result&&S.result.lines.join()].join('|');
  if(key===lastFocusKey){ if(fid){ const el=document.getElementById(fid); if(el&&ROOT.contains(el)&&document.activeElement!==el){ try{ el.focus({preventScroll:true}); }catch(e){} } } return; }
  lastFocusKey=key;
  const sc=activeScope(); if(!sc) return;
  const el=sc.querySelector('[data-primary]:not([disabled])')||sc.querySelector('button:not([disabled])');
  if(el){ try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }
}
ROOT.addEventListener('keydown',function(e){
  const ae=document.activeElement; const typing=ae&&ae.tagName==='INPUT'&&ae.type==='text';
  if(e.key==='Escape'&&S.modal){ S.modal=null; render(); e.preventDefault(); return; }
  if(typing) return;
  if(e.key==='f'||e.key==='F'){ goFullscreen(false); return; }
  const dirs={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}; const d=dirs[e.key]; if(!d) return;
  const sc=activeScope(); if(!sc) return;
  const items=Array.prototype.filter.call(sc.querySelectorAll('button:not([disabled]),input'),el=>el.offsetParent!==null&&!el.closest('.board'));
  if(!items.length) return; e.preventDefault();
  const cur0=items.indexOf(ae)>=0?ae:null;
  if(!cur0){ items[0].focus(); return; }
  const r0=cur0.getBoundingClientRect(), x0=r0.left+r0.width/2, y0=r0.top+r0.height/2; let best=null, bs=Infinity;
  items.forEach(el=>{ if(el===cur0) return; const r=el.getBoundingClientRect(); const dx=r.left+r.width/2-x0, dy=r.top+r.height/2-y0;
    const along=dx*d[0]+dy*d[1]; if(along<=4) return; const sc2=along+(Math.abs(dx*d[1])+Math.abs(dy*d[0]))*2.5; if(sc2<bs){ bs=sc2; best=el; } });
  if(best) best.focus();
});

/* ====================================================== acciones */
function startGame(){
  const st=S.setup; let ids=CH.map(c=>c.id).filter(id=>st.sel[id]);
  if(ids.length<2) return;
  if(st.order) ids=shuffle(ids);
  S.players=ids.map((id,i)=>({id:'p'+i,char:id,name:(st.names[id]||'').replace(/[<>&"'`\\]/g,'').trim()||byId[id].name,pos:1,jail:false,skip:0,tragos:0,fraudes:0}));
  S.cur=0; S.notes=[]; S.log=[]; S.modal=null; S.over=null; S.lock=false; S.card=null; S.result=null;
  S.screen='game'; S.scene='intro'; S.slide=0; S.introReturn=false; S.turnKey++;
  save(); render();
}
function rematch(){
  S.players.forEach(p=>{p.pos=1;p.jail=false;p.skip=0;p.tragos=0;p.fraudes=0;});
  if(S.setup.order) S.players=shuffle(S.players);
  S.cur=0; S.notes=[]; S.log=[]; S.modal=null; S.over=null; S.lock=false; S.card=null; S.result=null;
  S.scene='present'; S.slide=0; S.turnKey++;
  save(); render();
}
function goFullscreen(quiet){
  try{
    const d=ROOT;
    if(document.fullscreenElement){ if(!quiet) document.exitFullscreen(); return; }
    const pr=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
    if(pr&&pr.catch) pr.catch(()=>{ if(!quiet) toast('Este navegador no deja poner pantalla completa aquí'); });
  }catch(err){ if(!quiet) toast('Este navegador no deja poner pantalla completa aquí'); }
}
APP.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act; const m=S.modal;
  switch(a){
    case 'setup': S.screen='setup'; render(); break;
    case 'title': S.screen='title'; S.over=null; S.modal=null; load(); render(); break;
    case 'start': goFullscreen(true); startGame(); break;
    case 'resume': { const j=load(); if(j){ S.players=j.players; S.cur=j.cur; S.notes=j.notes||[]; S.log=j.log||[]; S.modal=null; S.over=null; S.lock=false; S.screen='game'; S.scene='overview'; S.turnKey++; goFullscreen(true); render(); } break; }
    case 'rules': S.modal={t:'rules'}; render(); break;
    case 'inext': if(S.slide<INTRO.length-1){ S.slide++; } else if(S.introReturn){ S.introReturn=false; S.scene='overview'; S.turnKey++; } else { S.scene='present'; S.slide=0; } render(); break;
    case 'iprev': S.slide=Math.max(0,S.slide-1); render(); break;
    case 'iskip': if(S.introReturn){ S.introReturn=false; S.scene='overview'; S.turnKey++; } else { S.scene='present'; S.slide=0; } render(); break;
    case 'pnext': if(S.slide<S.players.length-1){ S.slide++; } else { S.scene='overview'; S.turnKey++; } render(); break;
    case 'pprev': S.slide=Math.max(0,S.slide-1); render(); break;
    case 'pskip': S.scene='overview'; S.turnKey++; render(); break;
    case 'tozoom': if(!S.lock){ S.scene='zoom'; render(); } break;
    case 'tooverview': if(!S.lock){ S.scene='overview'; render(); } break;
    case 'roll': rollTurn(); break;
    case 'cell': if(!S.lock&&(S.scene==='overview'||S.scene==='zoom')&&!S.modal){ S.modal={t:'info',n:+t.dataset.n}; render(); } break;
    case 'btn': pressBtn(+t.dataset.i); break;
    case 'after': if(!S.lock) afterResult(); break;
    case 'picked': { const p=pById(t.dataset.id); runButton(S.pick.b,p); break; }
    case 'pickback': S.scene='card'; render(); break;
    case 'jailroll': if(!S.lock) jailRoll(); break;
    case 'jaildrink': if(!S.lock) jailDrink(); break;
    case 'fraud': S.modal={t:'fraud',sel:null}; render(); break;
    case 'fsel': m.sel=t.dataset.id; render(); break;
    case 'fpen': if(m&&m.sel) applyFraud(m.sel,+t.dataset.n,t.dataset.l); break;
    case 'closem': S.modal=null; render(); break;
    case 'score': S.modal={t:'score'}; render(); break;
    case 'settings': S.modal={t:'settings'}; render(); break;
    case 'adj': adjust(t.dataset.id,t.dataset.f,+t.dataset.d); break;
    case 'replay': S.modal=null; S.introReturn=true; S.scene='intro'; S.slide=0; render(); break;
    case 'newgame': wipe(); S.screen='setup'; S.modal=null; render(); break;
    case 'rematch': rematch(); break;
    case 'fs': goFullscreen(false); break;
  }
});
APP.addEventListener('input',function(e){
  const t=e.target; if(t.dataset.name!==undefined) S.setup.names[t.dataset.name]=t.value;
});
APP.addEventListener('change',function(e){
  const t=e.target;
  if(t.dataset.sel!==undefined){ S.setup.sel[t.dataset.sel]=t.checked?1:0; render(); }
  if(t.dataset.order!==undefined){ S.setup.order=t.checked; }
});
let rz=null, lastSize='';
function onResize(){
  const key=ROOT.clientWidth+'x'+ROOT.clientHeight; if(key===lastSize) return; lastSize=key;
  clearTimeout(rz); rz=setTimeout(function(){
    measure();
    if(S.screen==='game'){
      if(colsNow()!==builtCols){ built=false; render(); }
      else { setBar(); lastCam=''; camApply(false,true); render(); }
    }
    else if(S.screen==='title') render();
  },120);
}
window.addEventListener('resize',onResize);
try{ if(window.ResizeObserver) new ResizeObserver(onResize).observe(ROOT); }catch(e){}
try{ if(navigator.wakeLock&&navigator.wakeLock.request){ navigator.wakeLock.request('screen').catch(()=>{}); } }catch(e){}
load(); render();
})();
</script>
